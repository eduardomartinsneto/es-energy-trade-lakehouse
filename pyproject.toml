[project]
name = "es-energy-trade"
version = "0.1.0"
description = "Spain energy imports lakehouse on Databricks"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["requests", "beautifulsoup4", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest", "pyspark>=3.5,<4", "pandas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
